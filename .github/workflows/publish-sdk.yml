name: Publish SDK to Maven Central

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Maven Central
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          passphrase: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: Configure Gradle Setup
        env:
          SONATYPE_USER: ${{ secrets.SONATYPE_USERNAME_TOKEN }}
          SONATYPE_PASS: ${{ secrets.SONATYPE_PASSWORD_TOKEN }}
          GPG_KEY_ID: ${{ secrets.OSSRH_GPG_SECRET_KEY_ID }}
          GPG_PASS: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.gradle
          cat <<EOF > ~/.gradle/gradle.properties
          mavenCentralUsername=$SONATYPE_USER
          mavenCentralPassword=$SONATYPE_PASS
          signing.gnupg.keyName=$GPG_KEY_ID
          signing.gnupg.passphrase=$GPG_PASS
          EOF

      - name: Publish and Release SDK
        run: ./gradlew :sdk:publishAndReleaseToMavenCentral --no-daemon
        working-directory: android

      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { repo, owner } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = `🚨 Maven Central publishing failed for ${context.ref}`;
            const body = [
              `The **Publish SDK to Maven Central** workflow failed.`,
              ``,
              `**Workflow run:** ${runUrl}`,
              `**Triggered by:** ${context.eventName}`,
              `**Ref:** \`${context.ref}\``,
              ``,
              `Please check the logs and fix the issue before the next release.`,
            ].join('\n');
            await github.rest.issues.create({ owner, repo, title, body, labels: ['ci-failure'] });

